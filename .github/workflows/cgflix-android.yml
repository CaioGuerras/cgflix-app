name: CGFLIX Android

# APK de release do CGFLIX a cada push no main e em PRs (artifact `cgflix-apk`).
# Assinado com a chave de debug: instala normalmente. Sem segredos nem escrita
# (regra do CI para workflows de PR); a Release com chave própria está em
# cgflix-release.yml (tags v*).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Mesma versão do Flutter usada pelo upstream (build.yml / ci.yml).
  FLUTTER_VERSION: "3.47.1"

concurrency:
  group: cgflix-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK de release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache do Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: cgflix-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Dependências
        run: flutter pub get --enforce-lockfile --no-example

      # Sem Sentry nem verificação de atualização do upstream (não definimos esses flags).
      - name: Compilar APK
        run: flutter build apk --release --split-per-abi --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Nomear APKs
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/cgflix-$abi.apk"
          done
          ls -lh dist

      - name: Publicar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cgflix-apk
          path: dist/*.apk
          if-no-files-found: error

      # Play Store (07/10): mesmo build e mesma assinatura do APK, no formato que a Play aceita
      - name: Compilar AAB (Play Store)
        run: flutter build appbundle --release --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Publicar artifact do AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cgflix-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
